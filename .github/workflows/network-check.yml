name: Network Configuration Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-config:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show runner information
        run: |
          uname -a
          pwd
          ls -la

      - name: Check required files
        run: |
          test -f server-info.txt
          test -f firewall-rules.txt
          test -f monitoring.conf

      - name: Check required settings
        run: |
          grep -q '^hostname=' server-info.txt
          grep -q '^private_ip=' server-info.txt
          grep -q '^Allow TCP 22 from ' firewall-rules.txt
          grep -q '^target=' monitoring.conf

      - name: Build validated configuration bundle
        run: |
          mkdir -p dist
          cp server-info.txt firewall-rules.txt monitoring.conf dist/
          echo "commit=${GITHUB_SHA}" > dist/build-info.txt
          tar -czf network-config-${GITHUB_SHA}.tar.gz -C dist .

      - name: Upload validated configuration artifact
        uses: actions/upload-artifact@v7
        with:
          name: network-config-${{ github.sha }}
          path: network-config-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
